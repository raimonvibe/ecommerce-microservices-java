#Server port
server.port= 8900

#Application name
spring.application.name= api-gateway

#Client registration options :
eureka.client.service-url.defaultZone = http://localhost:8761/eureka

# Map paths to services (replaces Zuul prefix=/api)
spring.cloud.gateway.mvc.routes[0].id=userservice
spring.cloud.gateway.mvc.routes[0].uri=lb://user-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/accounts/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[1].id=catalogservice
spring.cloud.gateway.mvc.routes[1].uri=lb://product-catalog-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/catalog/**
spring.cloud.gateway.mvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[2].id=orderservice
spring.cloud.gateway.mvc.routes[2].uri=lb://order-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/shop/**
spring.cloud.gateway.mvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[3].id=recommendationservice
spring.cloud.gateway.mvc.routes[3].uri=lb://product-recommendation-service
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/review/**
spring.cloud.gateway.mvc.routes[3].filters[0]=StripPrefix=1

#SPRING SESSION & REDIS PROPERTIES :
spring.session.store-type=redis
spring.session.redis.namespace=session
spring.session.redis.flush-mode=on-save
spring.redis.host=localhost
spring.redis.port=6379
